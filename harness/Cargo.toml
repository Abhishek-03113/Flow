[package]
name = "flow-harness"
version.workspace = true
edition.workspace = true
description = "Multi-daemon scenario harness: virtual devices on emulated OSes, a scenario DSL, an OS-pair matrix and reports."

[lib]
path = "src/lib.rs"

[[bin]]
name = "flow-harness"
path = "src/main.rs"

[dependencies]
flow-core = { path = "../core" }
flow-daemon = { path = "../daemon" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
tokio-tungstenite = "0.30"
futures-util = "0.3"
