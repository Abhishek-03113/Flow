name = "rapid-switching"
description = """
200 hotkey toggles with typing in between, as fast as the harness can go: every character lands on the screen
that was active when it was typed, in order, with no leaks, no stuck keys and the controller ends at home."""

[world]
debounce_ms = 0
timeout_ms = 20000

[[steps]]
do = "repeat"
times = 100
steps = [
  { do = "hotkey", on = "ctl" },
  { do = "type", on = "ctl", text = "ab" },
  { do = "hotkey", on = "ctl" },
  { do = "type", on = "ctl", text = "cd" },
]

[[steps]]
do = "expect"
that = "active"
on = "ctl"
is = "local"
[[steps]]
do = "expect"
that = "injected"
on = "ctd"
events = ["down A", "up A", "down B", "up B"]
repeat = 100
[[steps]]
do = "expect"
that = "delivered"
on = "ctl"
events = ["down C", "up C", "down D", "up D"]
repeat = 100
[[steps]]
do = "expect"
that = "nothing_stuck"
on = "ctd"
[[steps]]
do = "expect"
that = "entered"
on = "ctd"
is = false
[[steps]]
do = "expect"
that = "suppressed"
on = "ctl"
is = false
