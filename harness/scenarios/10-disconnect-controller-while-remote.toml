name = "disconnect-controller-while-remote"
description = """
The controller goes away while driving the controlled machine with a key and a button held: the controlled
machine releases both itself (nothing stuck down) and stops being a target; when the controller comes back
it captures again and the hotkey works."""

[[steps]]
do = "hotkey"
on = "ctl"
[[steps]]
do = "expect"
that = "entered"
on = "ctd"
is = true
[[steps]]
do = "press"
on = "ctl"
key = "B"
[[steps]]
do = "button_down"
on = "ctl"
[[steps]]
do = "expect"
that = "injected"
on = "ctd"
events = ["down B", "button_down left"]

[[steps]]
do = "disconnect"
device = "ctl"
[[steps]]
do = "wait"
that = "entered"
on = "ctd"
is = false
[[steps]]
do = "expect"
that = "nothing_stuck"
on = "ctd"
[[steps]]
do = "expect"
that = "linked"
on = "ctd"
peer = "ctl"
is = false

[[steps]]
do = "reconnect"
device = "ctl"
[[steps]]
do = "expect"
that = "capturing"
on = "ctl"
is = true
[[steps]]
do = "clear"
[[steps]]
do = "hotkey"
on = "ctl"
[[steps]]
do = "expect"
that = "active"
on = "ctl"
is = "ctd"
[[steps]]
do = "type"
on = "ctl"
text = "z"
[[steps]]
do = "expect"
that = "injected"
on = "ctd"
events = ["down Z", "up Z"]
