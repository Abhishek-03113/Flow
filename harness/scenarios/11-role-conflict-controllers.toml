name = "role-conflict-controllers"
description = """
Two controllers cannot be linked: both ends refuse with role_conflict, the device shows the error, and
nothing is ever forwarded between them. Each keeps sharing its own keyboard locally as usual."""

[[devices]]
name = "one"
os = "$a"
role = "controller"
[[devices]]
name = "two"
os = "$b"
role = "controller"

[[links]]
a = "one"
b = "two"
expect = "refused:role_conflict"

[[steps]]
do = "expect"
that = "link_error"
on = "one"
peer = "two"
is = "role_conflict"
[[steps]]
do = "expect"
that = "link_error"
on = "two"
peer = "one"
is = "role_conflict"
[[steps]]
do = "expect"
that = "linked"
on = "one"
peer = "two"
is = false

[[steps]]
do = "switch_to"
on = "one"
target = "two"
expect_error = "device_not_switchable"
[[steps]]
do = "hotkey"
on = "one"
[[steps]]
do = "expect"
that = "active"
on = "one"
is = "local"
[[steps]]
do = "type"
on = "one"
text = "ab"
[[steps]]
do = "type"
on = "two"
text = "cd"
[[steps]]
do = "expect"
that = "no_forwarding"
on = "one"
[[steps]]
do = "expect"
that = "no_forwarding"
on = "two"
[[steps]]
do = "expect"
that = "injected"
on = "one"
events = []
[[steps]]
do = "expect"
that = "injected"
on = "two"
events = []
[[steps]]
do = "expect"
that = "capturing"
on = "one"
is = true
[[steps]]
do = "expect"
that = "capturing"
on = "two"
is = true
