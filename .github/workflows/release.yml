name: Release

# Pushing a tag like v2.0.0 builds installers and attaches them to a DRAFT GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal   # .dmg
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: windows           # .msi / NSIS .exe
            os: windows-latest
            args: ''
            rust_targets: ''
          - name: linux             # .AppImage / .deb
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Add universal macOS targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}
      # flow-app is a member of the root workspace, so the target dir is ./target (the default).
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - name: Install UI dependencies
        working-directory: app/ui
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- Signing / notarization: all OPTIONAL. Unsigned builds still work. ----
          # Updater signing (only if the Tauri updater plugin is enabled):
          #   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing (Developer ID Application certificate exported as .p12, base64):
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
          # macOS notarization (Apple ID + app-specific password, or an App Store Connect API key):
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
          #   (or APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode signing: configure via bundle.windows.signCommand in
          # tauri.conf.json (e.g. Azure Trusted Signing / a certificate thumbprint secret).
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Flow ${{ github.ref_name }}
          releaseBody: See the assets below to download and install Flow.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
