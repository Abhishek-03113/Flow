[package]
name = "flow-app"
version.workspace = true
edition.workspace = true
description = "Flow desktop app (Tauri 2 shell: window, tray, command bridge)"
publish = false

[lib]
name = "flow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
