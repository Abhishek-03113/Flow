[package]
name = "flow-app"
version.workspace = true
edition.workspace = true
description = "Flow desktop app (Tauri 2 shell: window, tray, command bridge)"
publish = false

[lib]
name = "flow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
flow-core = { path = "../../core" }
flow-daemon = { path = "../../daemon" }
tauri = { version = "=2.12.2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.0"
tauri-plugin-notification = "=2.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync"] }

# Desktop-only plugins: a second app instance must not start a second engine,
# and launch-at-login only exists on desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "=2.5.2"
tauri-plugin-autostart = "=2.7.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "test-util"] }

[lints]
workspace = true
