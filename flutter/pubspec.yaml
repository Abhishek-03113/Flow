name: flow_ui
description: >
  Control-plane UI for the Flow daemon: menu bar / system tray, device
  pairing, settings, and connection status. Never owns the real-time input
  pipeline itself — see docs/product/vision.md.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
