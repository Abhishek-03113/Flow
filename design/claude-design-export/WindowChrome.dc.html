<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ st.bar }}">
  <sc-if value="{{ isMac }}" hint-placeholder-val="{{ false }}">
    <div style="{{ st.macDots }}">
      <span style="{{ st.dotRed }}"></span>
      <span style="{{ st.dotYellow }}"></span>
      <span style="{{ st.dotGreen }}"></span>
    </div>
  </sc-if>
  <div style="{{ st.titleWrap }}">{{ title }}</div>
  <sc-if value="{{ isWin }}" hint-placeholder-val="{{ false }}">
    <div style="{{ st.winControls }}">
      <div style="{{ st.winBtn }}">&#8212;</div>
      <div style="{{ st.winBtn }}">&#9633;</div>
      <div style="{{ st.winBtn }}">&#10005;</div>
    </div>
  </sc-if>
  <sc-if value="{{ isGnome }}" hint-placeholder-val="{{ false }}">
    <div style="{{ st.gnomeControls }}">
      <div style="{{ st.gnomeBtn }}">&#8211;</div>
      <div style="{{ st.gnomeBtn }}">&#9633;</div>
      <div style="{{ st.gnomeBtn }}">&#10005;</div>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;platformControls&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;mac&quot;,&quot;options&quot;:[&quot;mac&quot;,&quot;win&quot;,&quot;gnome&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Window&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const controls = p.platformControls || 'mac';
    const bg = p.bg || '#f5f5f7';
    const border = p.border || 'rgba(0,0,0,0.1)';
    const textColor = p.textColor || '#111';
    const textSecondary = p.textSecondary || 'rgba(0,0,0,0.5)';
    const isMac = controls === 'mac', isWin = controls === 'win', isGnome = controls === 'gnome';
    const bar = { display: 'flex', alignItems: 'center', height: '40px', padding: '0 14px', background: bg, borderBottom: '1px solid ' + border, borderTopLeftRadius: '10px', borderTopRightRadius: '10px', gap: '10px', flexShrink: 0, fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' };
    const dotBase = { width: '11px', height: '11px', borderRadius: '50%', display: 'inline-block' };
    return {
      isMac, isWin, isGnome,
      title: p.title || '',
      st: {
        bar,
        macDots: { display: 'flex', gap: '7px', alignItems: 'center', order: 0 },
        dotRed: { ...dotBase, background: '#ff5f57' },
        dotYellow: { ...dotBase, background: '#febc2e' },
        dotGreen: { ...dotBase, background: '#28c840' },
        titleWrap: { flex: 1, textAlign: isWin ? 'left' : 'center', fontSize: '13px', fontWeight: 600, color: textColor, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', order: 1 },
        winControls: { display: 'flex', gap: '2px', order: 2, fontSize: '13px', color: textSecondary },
        winBtn: { width: '32px', height: '40px', display: 'flex', alignItems: 'center', justifyContent: 'center' },
        gnomeControls: { display: 'flex', gap: '8px', order: 2 },
        gnomeBtn: { width: '20px', height: '20px', borderRadius: '50%', background: 'rgba(128,128,128,0.18)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '11px', color: textSecondary }
      }
    };
  }
}

</script>
</body>
</html>
