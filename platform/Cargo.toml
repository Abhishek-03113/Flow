[package]
name = "flow-platform"
version.workspace = true
edition.workspace = true

[dependencies]
flow-core = { path = "../core" }
# Only for reporting best-effort failures (e.g. an EVIOCGRAB the kernel
# refuses on one device) that the adapters deliberately continue past —
# `flow-daemon` installs the subscriber, so these are no-ops in a library
# consumer that doesn't.
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
# "highsierra" gates CGEvent::new_scroll_event, used by translate.rs's tests
# to build a synthetic scroll CGEvent without needing a live event tap.
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
# `ForeignType::from_ptr` — lets capture.rs's raw event-tap trampoline
# borrow a `CGEvent` from the `CGEventRef` the C callback hands it,
# without taking ownership. `core-graphics` uses this same crate
# internally (same 0.5 version) but does not re-export the trait.
foreign-types = "0.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
